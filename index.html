<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo — Gestão de Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sidebar-bg:#ffffff;
  --sidebar-bg-2:#fbf7f1;
  --sidebar-text:#33202a;
  --sidebar-text-dim:#9c8790;
  --accent:#6e1424;
  --accent-2:#8f2540;
  --accent-ink:#48101c;
  --gold:#b8935a;
  --saciatta:#c97b45;
  --bg:#f8f5f0;
  --surface:#ffffff;
  --surface-2:#f4ede2;
  --text:#2b1a1e;
  --text-muted:#8a7568;
  --border:#e8dfd0;
  --border-soft:#f0e8da;
  --danger:#a03c2f;
  --danger-bg:#f5e0da;
  --success:#3a6b4f;
  --success-bg:#e2ecdf;
  --warning:#8a6a1f;
  --warning-bg:#f2e8cf;
  --info:#3c5f8a;
  --info-bg:#e1e8f0;
  --radius:12px;
  --shadow:0 1px 2px rgba(72,16,28,.06), 0 8px 24px rgba(72,16,28,.07);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#171009;
    --surface:#211610;
    --surface-2:#271b13;
    --text:#efe4d6;
    --text-muted:#ab9784;
    --border:#3c2f22;
    --border-soft:#2c2116;
    --danger-bg:#3a2620;
    --success-bg:#22301f;
    --warning-bg:#332a17;
    --info-bg:#1e2836;
  }
}
:root[data-theme="dark"]{
  --bg:#171009;
  --surface:#211610;
  --surface-2:#271b13;
  --text:#efe4d6;
  --text-muted:#ab9784;
  --border:#3c2f22;
  --border-soft:#2c2116;
  --danger-bg:#3a2620;
  --success-bg:#22301f;
  --warning-bg:#332a17;
  --info-bg:#1e2836;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.brand{font-family:'Cormorant Garamond',serif;}
.caps{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

#shell{display:flex;min-height:100vh;}

/* ---------- sidebar ---------- */
#sidebar{
  width:236px;flex:0 0 236px;
  background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg-2));
  color:var(--sidebar-text);
  display:flex;flex-direction:column;
  padding:26px 18px;
  border-right:1px solid var(--border-soft);
  position:sticky;top:0;height:100vh;
}
.logo{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:25px;letter-spacing:.01em;color:var(--accent-ink);margin:2px 4px 4px;}
.logo span{color:var(--accent);}
.logo-tag{font-family:'Oswald',sans-serif;font-size:9.5px;letter-spacing:.18em;color:var(--sidebar-text-dim);text-transform:uppercase;margin:0 4px 28px;}
nav.nav{display:flex;flex-direction:column;gap:3px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:9px;cursor:pointer;
  color:var(--sidebar-text-dim);font-weight:500;font-size:13.5px;
  transition:background .15s,color .15s;
  border:none;background:none;text-align:left;width:100%;
}
.nav-item:hover{background:rgba(110,20,36,.06);color:var(--sidebar-text);}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-icon{width:17px;text-align:center;flex:0 0 auto;opacity:.9;}
.sidebar-spacer{flex:1;}
.role-pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Oswald',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:.09em;
  padding:3px 9px;border-radius:99px;margin-top:7px;text-transform:uppercase;
}
.role-pill.gestor{background:rgba(110,20,36,.1);color:var(--accent);}
.role-pill.executor{background:rgba(184,147,90,.22);color:#8a6a2f;}
.sidebar-user{border-top:1px solid var(--border-soft);padding-top:14px;margin-top:10px;}
.sidebar-user-name{font-weight:600;font-size:13.5px;color:var(--accent-ink);line-height:1.3;}
.sidebar-user-email{font-size:11.5px;color:var(--sidebar-text-dim);margin-top:1px;word-break:break-all;}
.sidebar-switch{margin-top:10px;font-size:12px;color:var(--sidebar-text-dim);background:none;border:1px solid var(--border);padding:6px 10px;border-radius:8px;cursor:pointer;width:100%;}
.sidebar-switch:hover{color:var(--accent);border-color:var(--accent);}

/* ---------- main ---------- */
#main{flex:1;min-width:0;padding:34px 40px 60px;max-width:1400px;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:700;margin:0 0 4px;}
.page-sub{color:var(--text-muted);margin:0 0 26px;font-size:14px;}

.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap;}
.search{
  flex:1;min-width:220px;max-width:420px;
  padding:10px 14px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13.5px;
}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);cursor:pointer;user-select:none;}
.chk input{accent-color:var(--accent);width:15px;height:15px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 16px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;
  cursor:pointer;transition:transform .08s,box-shadow .15s;white-space:nowrap;
}
.btn:hover{box-shadow:var(--shadow);}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-2);}
.btn.danger{color:var(--danger);border-color:var(--danger-bg);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.small{padding:6px 11px;font-size:12.5px;}

/* ---------- custom select (sem a seta feia do navegador) ---------- */
select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  padding:10px 34px 10px 12px;border-radius:9px;border:1px solid var(--border);
  background-color:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'><path d='M1 1L5.5 5.5L10 1' stroke='%237c6a5b' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:10px 7px;
  cursor:pointer;
}
select:focus{outline:2px solid var(--accent);outline-offset:-1px;}

/* ---------- board ---------- */
#board{display:grid;grid-template-columns:repeat(4,minmax(260px,1fr));gap:18px;align-items:start;}
.column{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;padding:14px;min-height:160px;}
.column-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 3px;}
.column-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.dot.demandas{background:#6b7280;}
.dot.producao{background:var(--gold);}
.dot.aprovacao{background:var(--danger);}
.dot.finalizado{background:var(--success);}
.column-count{color:var(--text-muted);font-size:13px;font-weight:600;}
.column-sub{font-family:'Oswald',sans-serif;color:var(--text-muted);font-size:10px;letter-spacing:.09em;font-weight:600;text-transform:uppercase;padding:0 4px 12px;}
.column-body{display:flex;flex-direction:column;gap:10px;min-height:60px;}
.column-empty{color:var(--text-muted);font-size:13px;text-align:center;padding:24px 6px;border:1.5px dashed var(--border);border-radius:10px;}

.card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:11px;
  padding:13px 14px;cursor:pointer;transition:box-shadow .15s,border-color .15s;
  border-left:4px solid var(--card-accent,var(--border-soft));
}
.card:hover{box-shadow:var(--shadow);border-color:var(--border);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-code{font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.03em;margin-bottom:3px;}
.card-title{font-weight:600;font-size:14.5px;margin-bottom:9px;word-break:break-word;}
.card-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tag{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;}
.tag.baixa{background:var(--info-bg);color:var(--info);}
.tag.media{background:var(--success-bg);color:var(--success);}
.tag.alta{background:var(--warning-bg);color:var(--warning);}
.tag.urgente{background:var(--danger-bg);color:var(--danger);}
.card-date{font-size:12px;color:var(--text-muted);}
.card-date.overdue{color:var(--danger);font-weight:600;}
.card-spacer{flex:1;}
.avatar{
  width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
}
.attach-count{display:flex;align-items:center;gap:3px;color:var(--text-muted);font-size:12px;}

/* ---------- brand seals ---------- */
.seal{width:28px;height:28px;border-radius:50%;flex:0 0 auto;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow);}
.seal img{width:78%;height:78%;object-fit:contain;}
.seal.lg{width:44px;height:44px;}
.brand-chip{display:inline-flex;align-items:center;gap:7px;}
.brand-chip .seal{width:20px;height:20px;}
.brand-name{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600;}
.brand-option{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:8px;transition:border-color .15s,background .15s;}
.brand-option:hover{border-color:var(--accent);}
.brand-option.selected{border-color:var(--accent);background:var(--surface-2);}
.brand-option input{accent-color:var(--accent);}

/* ---------- table (clients/admin) ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:600;padding:13px 16px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
td{padding:13px 16px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:hover{background:var(--surface-2);}
.pf-pj{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--info-bg);color:var(--info);letter-spacing:.04em;}
.table-empty{padding:50px 20px;text-align:center;color:var(--text-muted);}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-size:12.5px;color:var(--text-muted);}
.log-badge{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border-soft);letter-spacing:.03em;}
.log-action{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:7px;letter-spacing:.03em;text-transform:uppercase;background:var(--surface-2);color:var(--text-muted);}
.log-action.criou{background:var(--success-bg);color:var(--success);}
.log-action.moveu{background:var(--info-bg);color:var(--info);}
.log-action.aprovou{background:var(--success-bg);color:var(--success);}
.log-action.login,.log-action.logout{background:var(--surface-2);color:var(--text-muted);}
.log-action.excluiu{background:var(--danger-bg);color:var(--danger);}
.log-action.editou,.log-action.anexou,.log-action.comentou,.log-action.registrou{background:var(--warning-bg);color:var(--warning);}
.role-badge{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.05em;text-transform:uppercase;}
.role-badge.gestor{background:var(--success-bg);color:var(--success);}
.role-badge.executor{background:var(--info-bg);color:var(--info);}
.status-badge{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.05em;text-transform:uppercase;}
.status-badge.ativo{background:var(--success-bg);color:var(--success);}
.status-badge.inativo{background:var(--danger-bg);color:var(--danger);}
.level-badge{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;}
.level-badge.novo{background:var(--info-bg);color:var(--info);}
.level-badge.regular{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border-soft);}
.level-badge.fiel{background:var(--success-bg);color:var(--success);}
.level-badge.vip{background:rgba(184,147,90,.22);color:#8a6a2f;}

/* ---------- admin tabs ---------- */
.tabs{display:flex;gap:22px;padding:0 18px;border-bottom:1px solid var(--border-soft);}
.tab{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding:14px 2px;border-bottom:2px solid transparent;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.section-heading{padding:16px 18px 0;font-weight:600;font-family:'Cormorant Garamond',serif;font-size:18px;}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,10,4,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto;}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-bottom:5vh;}
.modal.wide{max-width:760px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:22px 26px 14px;border-bottom:1px solid var(--border-soft);}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;margin:0;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;line-height:1;padding:4px;}
.modal-body{padding:22px 26px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 26px 22px;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.field input[type=text],.field input[type=date],.field input[type=email],.field input[type=tel],.field input[type=password],.field select,.field textarea{
  width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit;
}
.field textarea{resize:vertical;min-height:80px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.status-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-soft);font-size:13px;margin-bottom:18px;}
.attach-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.attach-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border-soft);border-radius:9px;background:var(--surface-2);}
.attach-thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;background:var(--border-soft);flex:0 0 auto;}
.attach-icon{width:34px;height:34px;border-radius:7px;background:var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;}
.attach-name{flex:1;font-size:13px;word-break:break-all;}
.attach-size{font-size:11px;color:var(--text-muted);}
.upload-zone{border:1.5px dashed var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--text-muted);font-size:12.5px;cursor:pointer;}
.upload-zone:hover{border-color:var(--accent);color:var(--accent);}
.comment{padding:10px 0;border-bottom:1px solid var(--border-soft);}
.comment:last-child{border-bottom:none;}
.comment-meta{font-size:11.5px;color:var(--text-muted);margin-bottom:3px;display:flex;gap:8px;align-items:center;}
.comment-text{font-size:13.5px;}
.section-label{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 10px;}

/* ---------- timeline (clientes) ---------- */
.timeline{display:flex;flex-direction:column;}
.timeline-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.timeline-item:last-child{border-bottom:none;}
.timeline-icon{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;}
.timeline-body{flex:1;min-width:0;}
.timeline-meta{font-size:11.5px;color:var(--text-muted);margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.timeline-text{font-size:13.5px;word-break:break-word;}

/* ---------- dashboard (início) ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px;}
.stat-tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:16px 18px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.stat-tile:hover{box-shadow:var(--shadow);border-color:var(--border);}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;line-height:1;}
.stat-num.warn{color:var(--danger);}
.stat-label{font-family:'Oswald',sans-serif;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-top:6px;font-weight:600;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.home-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:18px 20px;}
.home-panel h3{font-family:'Cormorant Garamond',serif;margin:0 0 12px;font-size:18px;}
.home-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;cursor:pointer;}
.home-row:last-child{border-bottom:none;}
.home-row-sub{color:var(--text-muted);font-size:12px;margin-left:auto;white-space:nowrap;}
.home-empty{color:var(--text-muted);font-size:13px;padding:10px 0;}

/* ---------- login gate ---------- */
#onboard{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;}
.login-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:18px;padding:40px 38px;max-width:420px;width:92%;box-shadow:var(--shadow);}
.login-head{text-align:center;margin-bottom:26px;}
.login-mark{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:28px;}
.login-mark span{color:var(--accent);}
.login-tagline{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin-top:2px;}
.login-note{font-size:12px;color:var(--text-muted);margin-top:14px;text-align:center;line-height:1.5;}
.login-loading{text-align:center;color:var(--text-muted);font-size:13.5px;padding:20px 0;}
.login-error{background:var(--danger-bg);color:var(--danger);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:16px;line-height:1.4;}
.login-success{background:var(--success-bg);color:var(--success);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:16px;line-height:1.4;}
.field-pass-wrap{position:relative;}
.field-pass-wrap input{padding-right:42px;}
.pass-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:12px;padding:6px 8px;font-family:'Oswald',sans-serif;letter-spacing:.03em;}
.pass-toggle:hover{color:var(--accent);}
.login-links{display:flex;justify-content:center;margin-top:16px;}
.link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:2px;text-decoration:underline;font-family:inherit;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:13px;z-index:300;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;}
.toast.show{opacity:1;transform:translateY(0);}
.hint{font-size:12px;color:var(--text-muted);margin-top:4px;}
.empty-state{text-align:center;padding:70px 20px;color:var(--text-muted);}
.locked-note{font-size:12px;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:9px 12px;margin-top:14px;}

@media (max-width:1100px){#board{grid-template-columns:repeat(2,1fr);}}
@media (max-width:760px){
  #shell{flex-direction:column;}
  #sidebar{width:100%;flex:none;height:auto;position:relative;flex-direction:row;align-items:center;padding:14px 16px;gap:14px;}
  .logo{margin:0;font-size:19px;}
  .logo-tag{display:none;}
  nav.nav{flex-direction:row;overflow-x:auto;}
  .sidebar-spacer{display:none;}
  .sidebar-user{display:none;}
  #main{padding:22px 16px 50px;}
  #board{grid-template-columns:1fr;}
  .grid2{grid-template-columns:1fr;}
  .home-grid{grid-template-columns:1fr;}
}
</style>
</head>

  <aside id="sidebar">
    <div class="logo">Fluxo<span>.</span></div>
    <div class="logo-tag">Gestão de marketing</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-user" id="sidebarUser"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="onboard" style="display:none;"></div>

/* ===================== helpers ===================== */
function colorFor(id){
  if(!id) return '#8a7f68';
  let h=0; for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?';
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso.length<=10 ? iso+'T00:00:00' : iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
}
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR')+', '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtBytes(n){
  if(n==null) return '';
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return (n/1024).toFixed(0)+' KB';
  return (n/(1024*1024)).toFixed(1)+' MB';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

function startOfToday(){ const n = new Date(); n.setHours(0,0,0,0); return n; }
function todayISO(){ const n = startOfToday(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
function parseISODate(s){
  if(!s) return null;
  const parts = s.split('-').map(Number);
  if(parts.length<3 || !parts[0] || !parts[1] || !parts[2]) return null;
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function daysUntil(date){
  if(!date) return null;
  return Math.round((date - startOfToday())/86400000);
}
function nextBirthday(dateStr){
  const b = parseISODate(dateStr);
  if(!b) return null;
  const today = startOfToday();
  let next = new Date(today.getFullYear(), b.getMonth(), b.getDate());
  if(next < today) next = new Date(today.getFullYear()+1, b.getMonth(), b.getDate());
  return next;
}
function clientsUpcomingBirthdays(days){
  const out = [];
  S.clients.forEach(c=>{
    if(!c.birthday) return;
    const next = nextBirthday(c.birthday);
    if(!next) return;
    const d = daysUntil(next);
    if(d!=null && d>=0 && d<=days) out.push({client:c, next, days:d});
  });
  out.sort((a,b)=>a.days-b.days);
  return out;
}
function waLink(phone){
  if(!phone) return null;
  let digits = String(phone).replace(/\D/g,'');
  if(!digits) return null;
  if(digits.length<=11) digits = '55'+digits;
  return 'https://wa.me/'+digits;
}
function friendlyAuthError(code){
  const map = {
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/invalid-email':'Informe um e-mail válido.',
    'auth/user-disabled':'Esta conta foi desativada. Procure um gestor.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
    'auth/network-request-failed':'Não foi possível conectar. Verifique sua internet.',
    'auth/missing-password':'Informe sua senha.',
  };
  return map[code] || 'Não foi possível entrar. Verifique seus dados.';
}

   Preencha os campos abaixo com as chaves do SEU projeto Firebase
   (gratuito). Veja o passo a passo enviado junto com este arquivo.
   Enquanto ficar como está (com "COLE_AQUI"), o painel mostra uma tela
   pedindo a configuração em vez de abrir o sistema. */
const FIREBASE_CONFIG = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};
function firebaseConfigured(){
  return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'COLE_AQUI');
}
function initFirebase(){
  if(!firebaseConfigured()) return false;
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    S.auth = firebase.auth();
    S.db = firebase.firestore();
    try{ S.storage = firebase.storage(); }catch(e){ S.storage = null; }
    return true;
  }catch(e){ console.error('Firebase init falhou', e); return false; }
}

/* ===================== coleções Firestore ===================== */
function jobsCol(){ return S.db.collection('jobs'); }
function clientsCol(){ return S.db.collection('clients'); }
function usersCol(){ return S.db.collection('users'); }
function logsCol(){ return S.db.collection('logs'); }
function countersDoc(){ return S.db.collection('meta').doc('counters'); }

/* ===================== log de atividades ===================== */
async function logActivity(action, entity, entityId, description){
  const entry = {
    ts: new Date().toISOString(),
    userId: S.me.id, userEmail: S.me.email, userName: S.me.name,
    action, entity, entityId, description,
  };
  try{ await logsCol().add(entry); }
  catch(e){ console.warn('falha ao gravar log', e); }
}

/* ===================== código sequencial da demanda ===================== */
async function nextJobCode(){
  const ref = countersDoc();
  return S.db.runTransaction(async (tx)=>{
    const snap = await tx.get(ref);
    const seq = ((snap.exists && snap.data().jobSeq) || 0) + 1;
    tx.set(ref, {jobSeq:seq}, {merge:true});
    return 'JOB-' + String(seq).padStart(4,'0');
  });
}

/* ===================== perfil / sessão ===================== */
function profileName(id){
  if(!id) return null;
  if(id===S.me.id) return S.me.name || S.me.email || 'Você';
  const u = S.users.find(x=>x.id===id);
  return u ? (u.name || u.email) : null;
}

async function loadMyProfile(user){
  const ref = usersCol().doc(user.uid);
  let snap = await ref.get();
  const now = new Date().toISOString();
  if(!snap.exists){
    // primeiro acesso: perfil criado automaticamente como executor(a) ativo.
    // Para promover a primeira pessoa a gestor(a), ajuste o campo "role"
    // desse documento no Firestore Console (veja o passo a passo).
    const data = {name:user.displayName||'', email:user.email||'', role:'executor', status:'ativo', createdAt:now, lastLogin:now};
    await ref.set(data);
    snap = await ref.get();
  } else {
    try{ await ref.update({lastLogin:now}); }catch(e){}
  }
  const d = snap.data() || {};
  S.me.id = user.uid;
  S.me.email = user.email || d.email || '';
  S.me.name = d.name || user.email || '';
  S.role = d.role || 'executor';
  S.status = d.status || 'ativo';
}

function unsubscribeAll(){
  S.unsubs.forEach(u=>{ try{ u(); }catch(e){} });
  S.unsubs = [];
}
function resetAppState(){
  S.jobs = []; S.clients = []; S.users = []; S.logEntries = [];
  S.role = null; S.status = null;
  S.me = {id:null, name:'', email:null};
  S.page = 'home';
  const main = document.getElementById('main');
  if(main) main.innerHTML = '';
}

function subscribe(){
  const u1 = jobsCol().onSnapshot(qs=>{
    S.jobs = qs.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();
  }, e=>console.warn('jobs sub', e));
  const u2 = clientsCol().onSnapshot(qs=>{
    S.clients = qs.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();
  }, e=>console.warn('clients sub', e));
  const u3 = usersCol().onSnapshot(qs=>{
    S.users = qs.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();
  }, e=>console.warn('users sub', e));
  S.unsubs.push(u1,u2,u3);
  if(S.role==='gestor'){
    const u4 = logsCol().orderBy('ts','desc').limit(300).onSnapshot(qs=>{
      S.logEntries = qs.docs.map(d=>Object.assign({id:d.id}, d.data()));
      render();
    }, e=>console.warn('logs sub', e));
    S.unsubs.push(u4);
  }
}

function showLoginForm(prefillEmail, errorMsg, successMsg){
  const el = document.getElementById('onboard');
  el.style.display = 'flex';
  el.innerHTML = `
    <div class="login-card">
      <div class="login-head">
        <div class="login-mark">Fluxo<span>.</span></div>
        <div class="login-tagline">Gestão de marketing</div>
      </div>
      ${errorMsg? `<div class="login-error">${esc(errorMsg)}</div>` : ''}
      ${successMsg? `<div class="login-success">${esc(successMsg)}</div>` : ''}
      <div class="field"><label>E-mail</label><input type="email" id="li_email" value="${esc(prefillEmail||'')}" placeholder="voce@empresa.com"></div>
      <div class="field">
        <label>Senha</label>
        <div class="field-pass-wrap">
          <input type="password" id="li_pass" placeholder="Sua senha">
          <button type="button" class="pass-toggle" id="li_toggle">MOSTRAR</button>
        </div>
      </div>
      <button class="btn primary" id="li_submit" style="width:100%;justify-content:center;">Entrar</button>
      <div class="login-links"><button class="link-btn" id="li_forgot">Esqueci minha senha</button></div>
      <div class="login-note">As contas de acesso são criadas pelo administrador. Se você ainda não tem uma, procure um gestor.</div>
    </div>
  `;
  const passInput = document.getElementById('li_pass');
  const toggle = document.getElementById('li_toggle');
  toggle.onclick = ()=>{
    const showing = passInput.type==='text';
    passInput.type = showing ? 'password' : 'text';
    toggle.textContent = showing ? 'MOSTRAR' : 'OCULTAR';
  };
  document.getElementById('li_forgot').onclick = ()=>showForgotPasswordForm(document.getElementById('li_email').value.trim());

  const submit = document.getElementById('li_submit');
  const doSubmit = async ()=>{
    const email = document.getElementById('li_email').value.trim();
    const pass = document.getElementById('li_pass').value;
    if(!validEmail(email)){ showLoginForm(email, 'Informe um e-mail válido.'); return; }
    if(!pass){ showLoginForm(email, 'Informe sua senha.'); return; }
    submit.disabled = true; submit.textContent = 'Entrando…';
    try{
      await S.auth.signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged cuida do restante do fluxo
    }catch(e){
      console.warn('login falhou', e);
      showLoginForm(email, friendlyAuthError(e.code));
    }
  };
  submit.onclick = doSubmit;
  passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doSubmit(); });
}

function showForgotPasswordForm(prefillEmail){
  const el = document.getElementById('onboard');
  el.innerHTML = `
    <div class="login-card">
      <div class="login-head">
        <div class="login-mark">Fluxo<span>.</span></div>
        <div class="login-tagline">Recuperar senha</div>
      </div>
      <div id="forgotMsgArea"></div>
      <div class="field"><label>E-mail</label><input type="email" id="fp_email" value="${esc(prefillEmail||'')}" placeholder="voce@empresa.com"></div>
      <button class="btn primary" id="fp_submit" style="width:100%;justify-content:center;">Enviar instruções</button>
      <div class="login-links"><button class="link-btn" id="fp_back">Voltar para o login</button></div>
    </div>
  `;
  document.getElementById('fp_back').onclick = ()=>showLoginForm(document.getElementById('fp_email').value.trim());
  document.getElementById('fp_submit').onclick = async ()=>{
    const email = document.getElementById('fp_email').value.trim();
    const msgArea = document.getElementById('forgotMsgArea');
    if(!validEmail(email)){ msgArea.innerHTML = `<div class="login-error">Informe um e-mail válido.</div>`; return; }
    const btn = document.getElementById('fp_submit');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try{ await S.auth.sendPasswordResetEmail(email); }
    catch(e){ console.warn('reset de senha falhou', e); }
    msgArea.innerHTML = `<div class="login-success">Enviamos as instruções de recuperação para seu e-mail.</div>`;
    btn.disabled = false; btn.textContent = 'Enviar instruções';
  };
}

function doLogout(){
  if(S.auth) S.auth.signOut().catch(()=>{});
}

async function handleAuthChange(user){
  if(!user){
    unsubscribeAll();
    resetAppState();
    showLoginForm();
    return;
  }
  showLoginLoading('Verificando acesso…');
  try{
    await loadMyProfile(user);
  }catch(e){
    console.error('não foi possível carregar o perfil', e);
    showLoginLoading('Não foi possível carregar seu perfil…');
    setTimeout(()=>{ if(S.auth) S.auth.signOut().catch(()=>{}); }, 1800);
    return;
  }
  if(S.status==='inativo'){
    showDisabledScreen();
    return;
  }
  hideOnboard();
  subscribe();
  render();
}

function boot(){
  if(!initFirebase()){
    showConfigMissingScreen();
    return;
  }
  S.auth.onAuthStateChanged(handleAuthChange);
}

/* ===================== quadro (board) ===================== */
function jobMatchesFilters(j){
  if(!S.filters.showArchived && j.archived) return false;
  if(S.filters.showArchived && !j.archived) return false;
  if(S.filters.brand && S.filters.brand!=='todas' && j.brand!==S.filters.brand) return false;
  if(S.filters.onlyMine){
    const mine = j.createdBy===S.me.id || j.assignedTo===S.me.id;
    if(!mine) return false;
  }
  if(S.filters.q){
    const q = S.filters.q.toLowerCase();
    const client = S.clients.find(c=>c.id===j.clientId);
    const hay = [j.code, j.title, client?client.name:''].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function boardHTML(){
  const visible = S.jobs.filter(jobMatchesFilters);
  const byStatus = {};
  STATUS_DEF.forEach(c=>byStatus[c.key]=[]);
  visible.forEach(j=>{ (byStatus[j.status]||byStatus.demandas).push(j); });

  const canCreate = S.role==='gestor';

  return `
    <h1 class="page-title">Quadro de marketing</h1>
    <p class="page-sub">Da demanda à aprovação, com trilha de tudo que aconteceu.</p>
    <div class="toolbar">
      <input class="search" id="boardSearch" placeholder="Buscar por código, título ou cliente…" value="${esc(S.filters.q)}">
      <select id="brandFilter">
        <option value="todas" ${S.filters.brand==='todas'?'selected':''}>Todas as marcas</option>
        ${BRAND_LIST.map(b=>`<option value="${b.id}" ${S.filters.brand===b.id?'selected':''}>${b.name}</option>`).join('')}
      </select>
      <label class="chk"><input type="checkbox" id="onlyMine" ${S.filters.onlyMine?'checked':''}> Só os meus</label>
      <label class="chk"><input type="checkbox" id="showArchived" ${S.filters.showArchived?'checked':''}> Arquivados</label>
      <span style="flex:1"></span>
      <button class="btn primary" id="newJobBtn" ${canCreate?'':'disabled title="Só o gestor cria demandas"'}>+ Nova demanda</button>
    </div>
    <div id="board">
      ${STATUS_DEF.map(col=>columnHTML(col, byStatus[col.key])).join('')}
    </div>
  `;
}

function columnHTML(col, jobs){
  jobs = jobs.slice().sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
  return `
    <div class="column">
      <div class="column-head">
        <div class="column-name"><span class="dot ${col.key}"></span>${col.label}</div>
        <div class="column-count">${jobs.length}</div>
      </div>
      <div class="column-sub">${col.sub}</div>
      <div class="column-body">
        ${jobs.length ? jobs.map(cardHTML).join('') : '<div class="column-empty">Vazio.</div>'}

function cardHTML(j){

function adminLogHTML(){
  const f = S.adminFilters;
  let entries = S.logEntries.slice();
  const entities = ['todas', ...Array.from(new Set(S.logEntries.map(e=>e.entity)))];

  entries = entries.filter(e=>{
    if(f.entity!=='todas' && e.entity!==f.entity) return false;
    if(f.user!=='todos' && e.userId!==f.user) return false;
    if(f.q && !(e.description||'').toLowerCase().includes(f.q.toLowerCase())) return false;
    if(f.from && e.ts < f.from) return false;
    if(f.to && e.ts > (f.to+'T23:59:59')) return false;
    return true;
  });

  const userIds = Array.from(new Set(S.logEntries.map(e=>e.userId).filter(Boolean)));

  return `
    <div class="tabs">
      <button class="tab ${S.adminTab==='usuarios'?'active':''}" data-tab="usuarios">Usuários</button>

      </select>
      <select id="adminUser">

        ${userIds.map(id=>`<option value="${esc(id)}" ${f.user===id?'selected':''}>${esc(profileName(id) || id)}</option>`).join('')}
      </select>
      <input type="date" id="adminFrom" value="${f.from}">
      <input type="date" id="adminTo" value="${f.to}">
    </div>
    ${entries.length ? `
    <table>
      <thead><tr><th>Quando</th><th>Quem</th><th>Entidade</th><th>Ação</th><th>Descrição</th></tr></thead>
      <tbody>
        ${entries.slice(0,150).map(e=>`

        `).join('')}
      </tbody>
    </table>` : `<div class="table-empty">Nenhum registro encontrado para esse filtro.</div>`}
  `;
}

/* ===================== modais: estado ===================== */
let jobModalState = null;     // {jobId, mode:'create'|'view'|'edit'}
let clientModalState = null;  // {clientId, editing}
let userModalState = null;    // userId

function openJobModal(jobId){
  jobModalState = {jobId: jobId||null, mode: jobId?'view':'create'};
  clientModalState = null; userModalState = null;
  renderModal();
}
function openClientModal(clientId, editing){
  clientModalState = {clientId: clientId||null, editing: !!editing || !clientId};
  jobModalState = null; userModalState = null;
  renderModal();
}
function openUserModal(userId){
  userModalState = userId;
  jobModalState = null; clientModalState = null;
  renderModal();
}
function closeModal(){
  jobModalState = null; clientModalState = null; userModalState = null;
  document.getElementById('modalRoot').innerHTML = '';
}

function renderModal(){
  const root = document.getElementById('modalRoot');
  if(jobModalState){
    if(jobModalState.mode==='create'){
      root.innerHTML = jobFormModalHTML(null);
    } else if(jobModalState.mode==='edit'){
      const job = S.jobs.find(j=>j.id===jobModalState.jobId);
      if(!job){ closeModal(); return; }
      root.innerHTML = jobFormModalHTML(job);
    } else {
      const job = S.jobs.find(j=>j.id===jobModalState.jobId);
      if(!job){ closeModal(); return; }
      root.innerHTML = viewJobModalHTML(job);
    }
  } else if(clientModalState){
    const c = clientModalState.clientId ? S.clients.find(x=>x.id===clientModalState.clientId) : null;
    if(clientModalState.clientId && !c){ closeModal(); return; }
    root.innerHTML = clientModalState.editing ? clientEditFormHTML(c||{}, !c) : clientViewHTML(c, S.role==='gestor');
  } else if(userModalState){
    const u = S.users.find(x=>x.id===userModalState);
    if(!u){ closeModal(); return; }
    root.innerHTML = userModalHTML(u);
  } else {
    root.innerHTML = '';
    return;
  }
  bindModalEvents();
}

        <button class="modal-close" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="status-banner">
          <span class="dot ${job.status}"></span>
          <b>${statusInfo.label}</b>
          <span style="color:var(--text-muted)">— ${statusInfo.sub.toLowerCase()}</span>
          <span style="flex:1"></span>

          <div><div class="hint">Cliente / solicitante</div><div>${client?esc(client.name):'—'}</div></div>
          <div><div class="hint">Prazo</div><div class="${overdue?'text-danger':''}">${job.dueDate?fmtDate(job.dueDate):'—'}${overdue?' · atrasada':''}</div></div>
          <div><div class="hint">Criado por</div><div>${creatorName||'—'}</div></div>
          <div>
            <div class="hint">Responsável</div>
            ${isGestor ? `
              <select id="reassignSelect">
                <option value="">— ninguém —</option>

              </select>
            ` : `<div>${assigneeName||'— aguardando alguém assumir —'}</div>`}
          </div>

        <div class="section-label">Briefing</div>

        ${isGestor?`<button class="btn ghost" data-client-edit="1">Editar dados</button>`:''}
      </div>
    </div>
  </div>`;
}

/* ===================== modal: usuário (admin) ===================== */

    <div class="modal">
      <div class="modal-head">
        <h3 class="modal-title">Editar usuário</h3>
        <button class="modal-close" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="field"><label>Nome</label><input type="text" id="u_name" value="${esc(u.name||'')}"></div>
        <div class="field"><label>E-mail</label><input type="text" value="${esc(u.email||'')}" disabled></div>
        <div class="grid2">
          <div class="field"><label>Papel</label>
            <select id="u_role"><option value="executor" ${u.role!=='gestor'?'selected':''}>Executor(a)</option><option value="gestor" ${u.role==='gestor'?'selected':''}>Gestor(a)</option></select>
          </div>
          <div class="field"><label>Status</label>
            <select id="u_status"><option value="ativo" ${(u.status||'ativo')==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${u.status==='inativo'?'selected':''}>Inativo</option></select>
          </div>

        <button class="btn ghost" id="closeModal2">Cancelar</button>
        <button class="btn primary" id="saveUser">Salvar</button>

/* ===================== eventos de página ===================== */
function bindPageEvents(){
  if(S.page==='home'){
    document.querySelectorAll('[data-nav-target]').forEach(el=>{ el.onclick=()=>{ S.page=el.dataset.navTarget; render(); }; });
    document.querySelectorAll('[data-client-row]').forEach(el=>{ el.onclick=()=>openClientModal(el.dataset.clientRow); });
  } else if(S.page==='board'){
    const s = document.getElementById('boardSearch');
    if(s) s.oninput = ()=>{ S.filters.q = s.value; renderBoardOnly(); };
    const bf = document.getElementById('brandFilter');
    if(bf) bf.onchange = ()=>{ S.filters.brand = bf.value; render(); };
    const om = document.getElementById('onlyMine');
    if(om) om.onchange = ()=>{ S.filters.onlyMine = om.checked; render(); };
    const sa = document.getElementById('showArchived');
    if(sa) sa.onchange = ()=>{ S.filters.showArchived = sa.checked; render(); };
    const nb = document.getElementById('newJobBtn');
    if(nb) nb.onclick = ()=>{ if(S.role!=='gestor'){ toast('Só o gestor cria novas demandas.'); return;} openJobModal(null); };
    document.querySelectorAll('.card').forEach(el=>{ el.onclick = ()=>openJobModal(el.dataset.job); });
  } else if(S.page==='clients'){
    const s = document.getElementById('clientSearch');
    if(s) s.oninput = ()=>{ S.clientFilters.q = s.value; render(); };
    const lf = document.getElementById('clientLevelFilter');
    if(lf) lf.onchange = ()=>{ S.clientFilters.level = lf.value; render(); };
    const nb = document.getElementById('newClientBtn');
    if(nb) nb.onclick = ()=>{ if(S.role!=='gestor'){ toast('Só o gestor cadastra novos clientes.'); return;} openClientModal(null); };
    const ex = document.getElementById('exportCsvBtn');
    if(ex) ex.onclick = exportClientsCsv;
    document.querySelectorAll('[data-client]').forEach(el=>{ el.onclick = ()=>openClientModal(el.dataset.client); });
    document.querySelectorAll('[data-client-row]').forEach(el=>{ el.onclick = ()=>openClientModal(el.dataset.clientRow); });
  } else if(S.page==='admin'){
    document.querySelectorAll('[data-tab]').forEach(el=>{ el.onclick = ()=>{ S.adminTab = el.dataset.tab; render(); }; });
    if(S.adminTab==='log'){
      const q = document.getElementById('adminSearch'); if(q) q.oninput=()=>{S.adminFilters.q=q.value; render();};
      const en = document.getElementById('adminEntity'); if(en) en.onchange=()=>{S.adminFilters.entity=en.value; render();};
      const us = document.getElementById('adminUser'); if(us) us.onchange=()=>{S.adminFilters.user=us.value; render();};
      const fr = document.getElementById('adminFrom'); if(fr) fr.onchange=()=>{S.adminFilters.from=fr.value; render();};
      const to = document.getElementById('adminTo'); if(to) to.onchange=()=>{S.adminFilters.to=to.value; render();};
    } else {
      document.querySelectorAll('[data-edit-user]').forEach(el=>{ el.onclick = ()=>openUserModal(el.dataset.editUser); });
    }
  }
}

function renderBoardOnly(){
  const boardEl = document.getElementById('board');
  if(!boardEl) return;
  const visible = S.jobs.filter(jobMatchesFilters);
  const byStatus = {}; STATUS_DEF.forEach(c=>byStatus[c.key]=[]);
  visible.forEach(j=>(byStatus[j.status]||byStatus.demandas).push(j));
  boardEl.innerHTML = STATUS_DEF.map(col=>columnHTML(col, byStatus[col.key])).join('');
  document.querySelectorAll('.card').forEach(el=>{ el.onclick=()=>openJobModal(el.dataset.job); });
}

function bindModalEvents(){
  const ov = document.getElementById('ov');
  if(!ov) return;
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) closeModal(); });
  const c1 = document.getElementById('closeModal'); if(c1) c1.onclick = closeModal;
  const c2 = document.getElementById('closeModal2'); if(c2) c2.onclick = closeModal;

  ov.querySelectorAll('[data-brand-option]').forEach(el=>{
    el.onclick = ()=>{
      ov.querySelectorAll('[data-brand-option]').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      el.querySelector('input').checked = true;
    };
  });

  const saveJob = document.getElementById('saveJob');
  if(saveJob) saveJob.onclick = ()=>{ if(jobModalState && jobModalState.mode==='edit') saveJobEdit(); else createJob(); };

  const saveClient = document.getElementById('saveClient');
  if(saveClient) saveClient.onclick = saveClientForm;
  const delClient = document.getElementById('deleteClient');
  if(delClient) delClient.onclick = deleteClientForm;
  const editClientBtn = ov.querySelector('[data-client-edit]');
  if(editClientBtn) editClientBtn.onclick = ()=>{ clientModalState.editing = true; renderModal(); };
  const addInt = document.getElementById('addInteraction');
  if(addInt) addInt.onclick = addClientInteraction;

  const saveUser = document.getElementById('saveUser');
  if(saveUser) saveUser.onclick = saveUserForm;

  const reassign = document.getElementById('reassignSelect');
  if(reassign) reassign.onchange = ()=>reassignJob(reassign.value);

  ov.querySelectorAll('[data-action]').forEach(b=>{ b.onclick = ()=>handleJobAction(b.dataset.action); });

  const uz = document.getElementById('uploadZone');
  const fi = document.getElementById('fileInput');
  if(uz && fi){ uz.onclick = ()=>fi.click(); fi.onchange = handleFileUpload; }

  const addC = document.getElementById('addComment');
  if(addC) addC.onclick = addCommentToJob;
}

/* ===================== ações: demandas ===================== */
async function createJob(){
  if(S.role!=='gestor'){ toast('Apenas o gestor cria novas demandas.'); return; }
  const title = document.getElementById('f_title').value.trim();
  if(!title){ toast('Dê um título para a demanda.'); return; }
  const brandEl = document.querySelector('input[name="f_brand"]:checked');
  const brand = brandEl ? brandEl.value : BRAND_LIST[0].id;
  const clientId = document.getElementById('f_client').value || null;
  const priority = document.getElementById('f_priority').value;
  const dueDate = document.getElementById('f_due').value || '';
  const description = document.getElementById('f_desc').value || '';
  const now = new Date().toISOString();

  let code;
  try{ code = await nextJobCode(); }
  catch(e){ toast('Não foi possível gerar o código da demanda.'); return; }

  const data = {
    code, title, description, priority, dueDate, brand,
    clientId, status:'demandas', createdBy:S.me.id, assignedTo:null,
    attachments:[], comments:[], archived:false,
    createdAt:now, updatedAt:now,
  };

  try{ await jobsCol().add(data); }
  catch(e){ toast('Não foi possível criar a demanda.'); return; }
  await logActivity('criou','job',code,'Criou a demanda '+code+' — "'+title+'" ('+(BRANDS[brand]?BRANDS[brand].name:brand)+').');
  closeModal();
  toast('Demanda criada.');
}

async function saveJobEdit(){
  if(S.role!=='gestor'){ toast('Apenas o gestor edita demandas.'); return; }
  const job = S.jobs.find(j=>j.id===jobModalState.jobId);
  if(!job) return;
  const title = document.getElementById('f_title').value.trim();
  if(!title){ toast('Dê um título para a demanda.'); return; }
  const brandEl = document.querySelector('input[name="f_brand"]:checked');
  const patch = {
    title,
    brand: brandEl?brandEl.value:job.brand,
    clientId: document.getElementById('f_client').value || null,
    priority: document.getElementById('f_priority').value,
    dueDate: document.getElementById('f_due').value || '',
    description: document.getElementById('f_desc').value || '',
  };
  const ok = await updateJob(job.id, patch, {action:'editou', description:'Editou os dados da demanda '+job.code+'.'});
  if(ok){ jobModalState.mode='view'; toast('Alterações salvas.'); renderModal(); }
}

async function updateJob(jobId, patch, logMsg){
  patch.updatedAt = new Date().toISOString();
  try{ await jobsCol().doc(jobId).update(patch); }
  catch(e){ console.error(e); toast('Não foi possível salvar. Verifique sua conexão ou permissão.'); return false; }
  if(logMsg){ const j = S.jobs.find(x=>x.id===jobId); await logActivity(logMsg.action,'job', (j&&j.code)||jobId, logMsg.description); }
  return true;
}

async function reassignJob(newAssignee){
  if(S.role!=='gestor') return;
  const job = S.jobs.find(j=>j.id===jobModalState.jobId);
  if(!job) return;
  const name = newAssignee ? (profileName(newAssignee)||'alguém') : 'ninguém';
  await updateJob(job.id, {assignedTo: newAssignee||null}, {action:'editou', description:'Trocou o responsável de '+job.code+' para '+name+'.'});
  renderModal();
}

async function handleJobAction(action){
  const job = S.jobs.find(j=>j.id===jobModalState.jobId);
  if(!job) return;
  const code = job.code;
  const gestorOnly = ['reject','approve','archive','unarchive','delete','edit'];
  if(gestorOnly.includes(action) && S.role!=='gestor'){ toast('Apenas o gestor pode fazer isso.'); return; }

  if(action==='edit'){
    jobModalState.mode = 'edit';
    renderModal();
    return;
  } else if(action==='assume'){
    if(job.status!=='demandas'){ toast('Essa demanda já foi assumida.'); return; }
    await updateJob(job.id, {status:'producao', assignedTo:S.me.id}, {action:'moveu', description:'Assumiu a demanda '+code+' — moveu de Demandas para Em produção.'});
    toast('Demanda assumida.');
  } else if(action==='send-approval'){
    if(S.role!=='gestor' && job.assignedTo!==S.me.id){ toast('Só quem está com a demanda pode enviar para aprovação.'); return; }
    await updateJob(job.id, {status:'aprovacao'}, {action:'moveu', description:'Enviou '+code+' para aprovação.'});
    toast('Enviado para aprovação.');
  } else if(action==='reject'){
    await updateJob(job.id, {status:'producao'}, {action:'moveu', description:'Devolveu '+code+' para produção — solicitou ajustes.'});
    toast('Ajustes solicitados.');
  } else if(action==='approve'){
    await updateJob(job.id, {status:'finalizado'}, {action:'aprovou', description:'Aprovou e finalizou '+code+'.'});
    toast('Demanda finalizada!');
  } else if(action==='archive'){
    await updateJob(job.id, {archived:true}, {action:'editou', description:'Arquivou '+code+'.'});
  } else if(action==='unarchive'){
    await updateJob(job.id, {archived:false}, {action:'editou', description:'Reabriu '+code+'.'});
  } else if(action==='delete'){
    if(!confirm('Excluir a demanda '+code+'? Essa ação não pode ser desfeita.')) return;
    try{ await jobsCol().doc(job.id).delete(); }
    catch(e){ toast('Não foi possível excluir.'); return; }
    await logActivity('excluiu','job',code,'Excluiu a demanda '+code+'.');
    closeModal(); toast('Demanda excluída.');
    return;
  }
  renderModal();
}

async function addCommentToJob(){
  const ta = document.getElementById('newComment');
  const text = ta.value.trim();
  if(!text) return;
  const job = S.jobs.find(j=>j.id===jobModalState.jobId);
  const comments = (job.comments||[]).concat([{ts:new Date().toISOString(), userId:S.me.id, text}]);
  await updateJob(job.id, {comments}, {action:'comentou', description:'Comentou em '+job.code+'.'});
  ta.value='';
  renderModal();
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function handleFileUpload(e){
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  const job = S.jobs.find(j=>j.id===jobModalState.jobId);
  toast('Enviando '+files.length+' arquivo(s)…');
  const newAtt = [];
  const MAX_SIZE = 8*1024*1024; // 8 MB por arquivo (sem Storage configurado)

  for(const f of files){
    let uploaded = false;
    if(S.storage){
      try{
        const id = uid();
        const ref = S.storage.ref('anexos/'+job.id+'/'+id+'_'+f.name);
        await ref.put(f, {contentType:f.type||'application/octet-stream'});
        const url = await ref.getDownloadURL();
        newAtt.push({id, name:f.name, contentType:f.type||'application/octet-stream', sizeBytes:f.size, url});
        uploaded = true;
      }catch(err){ console.warn('upload no Storage falhou, tentando anexo local', err); }
    }
    if(!uploaded){
      if(f.size > MAX_SIZE){ toast(f.name+' é maior que 8 MB — configure o Firebase Storage para anexar arquivos maiores.'); continue; }
      try{
        const dataUrl = await fileToDataUrl(f);
        newAtt.push({id:uid(), name:f.name, contentType:f.type||'application/octet-stream', sizeBytes:f.size, dataUrl});
      }catch(err){ console.warn('anexo local falhou', err); toast('Falha ao anexar '+f.name); }
    }
  }

  if(newAtt.length){
    const attachments = (job.attachments||[]).concat(newAtt);
    await updateJob(job.id, {attachments}, {action:'anexou', description:'Anexou '+newAtt.length+' arquivo(s) em '+job.code+'.'});
    toast('Arquivo(s) anexado(s).');
  }
  e.target.value='';
  renderModal();
}

/* ===================== ações: clientes ===================== */
async function saveClientForm(){
  if(S.role!=='gestor'){ toast('Apenas o gestor gerencia os dados do cliente.'); return; }
  const name = document.getElementById('c_name').value.trim();
  if(!name){ toast('Dê um nome para o cliente.'); return; }
  const data = {
    name,
    company: document.getElementById('c_company').value.trim(),
    role: document.getElementById('c_role').value.trim(),
    phone: document.getElementById('c_phone').value.trim(),
    email: document.getElementById('c_email').value.trim(),
    city: document.getElementById('c_city').value.trim(),
    birthday: document.getElementById('c_birthday').value || '',
    relationshipOwner: document.getElementById('c_owner').value || null,
    relationshipLevel: document.getElementById('c_level').value,
    preferences: document.getElementById('c_prefs').value.trim(),
    notes: document.getElementById('c_notes').value.trim(),
    updatedAt: new Date().toISOString(),
  };
  const isNew = !clientModalState.clientId;
  try{
    if(isNew){
      data.timeline = []; data.lastContact = null; data.nextFollowUp = ''; data.createdAt = new Date().toISOString();
      const ref = await clientsCol().add(data);
      await logActivity('criou','cliente',name,'Cadastrou o cliente "'+name+'".');
      clientModalState = {clientId: ref.id, editing:false};
    } else {
      await clientsCol().doc(clientModalState.clientId).update(data);
      await logActivity('editou','cliente',name,'Editou o cliente "'+name+'".');
      clientModalState.editing = false;
    }
  }catch(e){ toast('Não foi possível salvar.'); return; }
  toast('Cliente salvo.');
  renderModal();
}

async function deleteClientForm(){
  if(S.role!=='gestor') return;
  const c = S.clients.find(x=>x.id===clientModalState.clientId);
  if(!c) return;
  if(!confirm('Excluir o cliente "'+c.name+'"? Essa ação não pode ser desfeita.')) return;
  try{ await clientsCol().doc(c.id).delete(); }
  catch(e){ toast('Não foi possível excluir.'); return; }
  await logActivity('excluiu','cliente',c.name,'Excluiu o cliente "'+c.name+'".');
  closeModal(); toast('Cliente excluído.');
}

async function addClientInteraction(){
  const c = S.clients.find(x=>x.id===clientModalState.clientId);
  if(!c) return;
  const type = document.getElementById('ct_type').value;
  const note = document.getElementById('ct_note').value.trim();
  const nextFollowUp = document.getElementById('ct_next').value || '';
  const now = new Date().toISOString();
  const entry = {id:uid(), ts:now, type, note, userId:S.me.id};
  const timeline = (c.timeline||[]).concat([entry]);
  const patch = {timeline, lastContact:now, updatedAt:now};
  if(nextFollowUp) patch.nextFollowUp = nextFollowUp;
  try{ await clientsCol().doc(c.id).update(patch); }
  catch(e){ toast('Não foi possível registrar.'); return; }
  const typeLabel = (CONTACT_TYPES.find(t=>t.key===type)||{label:type}).label;
  await logActivity('registrou','cliente',c.name,'Registrou contato ('+typeLabel+') com '+c.name+'.');
  toast('Contato registrado.');
  renderModal();
}

function exportClientsCsv(){
  const rows = [['Nome','Empresa/Rede','Cargo','Telefone','E-mail','Cidade','Aniversário','Responsável','Nível','Último contato','Próximo acompanhamento']];
  S.clients.forEach(c=>rows.push([
    c.name, c.company, c.role, c.phone, c.email, c.city, c.birthday,
    profileName(c.relationshipOwner)||'', c.relationshipLevel,
    c.lastContact?fmtDateTime(c.lastContact):'', c.nextFollowUp||''
  ]));
  const csv = rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'clientes.csv'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ===================== ações: usuários (admin) ===================== */
async function saveUserForm(){
  if(S.role!=='gestor') return;
  const u = S.users.find(x=>x.id===userModalState);
  if(!u) return;
  const name = document.getElementById('u_name').value.trim();
  const role = document.getElementById('u_role').value;
  const status = document.getElementById('u_status').value;
  if(u.id===S.me.id && role!=='gestor'){
    if(!confirm('Você está removendo seu próprio papel de gestor(a). Continuar?')) return;
  }
  if(u.id===S.me.id && status==='inativo'){
    if(!confirm('Você está desativando o seu próprio acesso. Continuar?')) return;
  }
  try{ await usersCol().doc(u.id).update({name, role, status}); }
  catch(e){ toast('Não foi possível salvar.'); return; }
  await logActivity('editou','usuario',u.email||u.id,'Atualizou o usuário '+(u.email||u.id)+' (papel: '+(role==='gestor'?'gestor(a)':'executor(a)')+', status: '+(status==='ativo'?'ativo':'inativo')+').');
  toast('Usuário atualizado.');
  closeModal();
}

boot();

})();
